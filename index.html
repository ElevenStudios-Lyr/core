<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFT Lyric Studio - Multi-Sync</title>
    <style>
        :root { --accent: #ff85a2; --bg: #050505; --card-bg: #111; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        #canvas-container { position: relative; box-shadow: 0 25px 70px rgba(0,0,0,0.9); margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #222; background: #1a1012; }
        canvas { display: block; background: #000; }

        .dashboard { background: var(--card-bg); padding: 25px; border-radius: 20px; width: 850px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #333; }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .label { font-size: 11px; color: #777; min-width: 90px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], input[type="file"] { background: #1a1a1a; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; flex: 1; font-size: 14px; }
        
        /* New Result List Styling */
        #results-container { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            max-height: 200px; overflow-y: auto; padding: 10px; 
            background: #0a0a0a; border-radius: 12px; border: 1px solid #222; 
        }
        .lyric-item { 
            background: #1a1a1a; padding: 12px; border-radius: 8px; border: 1px solid #333;
            cursor: pointer; transition: 0.2s; position: relative; font-size: 13px;
        }
        .lyric-item:hover { border-color: #555; background: #222; }
        .lyric-item.active { border-color: var(--accent); background: #251a1d; box-shadow: 0 0 10px rgba(255, 133, 162, 0.2); }
        .lyric-item .meta { font-size: 11px; color: #777; display: flex; justify-content: space-between; margin-top: 5px; }
        .lyric-item.active::after { content: 'ACTIVE'; position: absolute; right: 10px; top: 10px; font-size: 9px; background: var(--accent); color: black; padding: 2px 5px; border-radius: 4px; font-weight: bold; }

        .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #ccc; }
        button { padding: 15px; border: none; color: #000; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 10px; flex: 1; }
        #confirmBtn { background: var(--accent); }
        #recordBtn { background: #e74c3c; color: white; }
        #recordBtn.recording { background: #fff; color: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); margin-top: 10px; }
        .status { font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="previewCanvas" width="1280" height="720" style="width: 800px; height: 450px;"></canvas>
    </div>

    <div class="dashboard">
        <div class="input-row">
            <span class="label">Settings</span>
            <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
            <label class="checkbox-container"><input type="checkbox" id="blurToggle"> Blur Background</label>
        </div>
        <div class="input-row"><span class="label">Assets</span><input type="file" id="bgUpload" accept="image/*"><input type="file" id="audioUpload" accept="audio/*"></div>
        <div class="input-row">
            <input type="text" id="artist" placeholder="Artist Name">
            <input type="text" id="title" placeholder="Song Title">
            <button id="confirmBtn" style="flex: 0.4;">Search</button>
        </div>

        <!-- NEW LYRICS SELECTOR -->
        <div id="results-container">
            <div style="grid-column: 1/-1; text-align: center; color: #555; padding: 20px;">Search for a song to see available lyrics...</div>
        </div>

        <div class="input-row">
            <button id="recordBtn">Start Export</button>
        </div>
        <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
        <div class="status" id="statusMsg">Ready.</div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas'), ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audioPlayer'), statusMsg = document.getElementById('statusMsg');
        const resultsContainer = document.getElementById('results-container');
        const logo = new Image(); logo.src = 'ic.png';
        
        let syncedLyrics = [], currentLineIndex = -1, displayedText = "", targetText = "", textOpacity = 0, isFading = false;
        let customFontName = 'sans-serif', bgImg = new Image();
        bgImg.crossOrigin = "anonymous"; bgImg.src = 'https://vip-go.premiumbeat.com/wp-content/uploads/2018/10/pink-sky-cover.jpg';

        // Timing Constants
        const INTRO_DUR = 800, STAY_DUR = 2500, WIPE_DELAY = 600, OUTRO_START = INTRO_DUR + STAY_DUR;
        const WIPE_START = OUTRO_START - WIPE_DELAY, LOGO_OUTRO = 700, WIPE_DUR = 1400;

        function formatTime(sec) {
            if (!sec) return "0:00";
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getFitSize(text, maxW, baseSize) {
            let size = baseSize; ctx.font = `bold ${size}px "${customFontName}"`;
            while (ctx.measureText(text).width > maxW && size > 20) { size -= 2; ctx.font = `bold ${size}px "${customFontName}"`; }
            return size;
        }

        function resetPreviewState() { currentLineIndex = -1; displayedText = ""; targetText = ""; textOpacity = 0; isFading = false; }

        function loadLyrics(lrcString, id) {
            syncedLyrics = lrcString.split('\n').map(line => {
                const m = line.match(/\[(\d+):(\d+\.\d+)\]/);
                return m ? { time: (parseFloat(m[1])*60 + parseFloat(m[2])), text: line.replace(/\[.*\]/, '').replace(/[^a-zA-Z0-9\s']/g, '').trim() } : null;
            }).filter(x => x && x.text !== "");
            
            document.querySelectorAll('.lyric-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`lrc-${id}`)?.classList.add('active');
            statusMsg.innerText = `Lyrics Loaded (${syncedLyrics.length} lines)`;
            resetPreviewState();
        }

        document.getElementById('confirmBtn').onclick = async () => {
            const artist = document.getElementById('artist').value.trim(), title = document.getElementById('title').value.trim();
            if (!title) return alert("Enter song title");
            statusMsg.innerText = "Searching LRCLIB...";
            resultsContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #888;">Searching...</div>';

            try {
                const res = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
                const data = await res.json();
                resultsContainer.innerHTML = "";
                
                const validResults = data.filter(d => d.syncedLyrics);
                
                if (validResults.length === 0) {
                    resultsContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #e74c3c;">No synced lyrics found.</div>';
                    return;
                }

                validResults.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = "lyric-item";
                    div.id = `lrc-${item.id}`;
                    div.innerHTML = `
                        <strong>${item.trackName}</strong>
                        <div class="meta"><span>${item.artistName}</span> <span>${formatTime(item.duration)}</span></div>
                    `;
                    div.onclick = () => loadLyrics(item.syncedLyrics, item.id);
                    resultsContainer.appendChild(div);
                    if (index === 0) loadLyrics(item.syncedLyrics, item.id); // Auto-load first
                });
            } catch (e) { statusMsg.innerText = "Search failed."; }
        };

        // RENDER ENGINE
        function render() {
            const elapsed = audioPlayer.currentTime * 1000;
            const now = audioPlayer.currentTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let wipeProgress = 0;
            if (elapsed > WIPE_START) wipeProgress = (Math.min(1, (elapsed - WIPE_START) / WIPE_DUR));

            if (wipeProgress > 0) {
                ctx.save();
                if (document.getElementById('blurToggle').checked) ctx.filter = 'blur(8px)';
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
                ctx.restore();
                
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 15;

                const firstLyricTime = (syncedLyrics.length > 0 ? syncedLyrics[0].time : 9999);
                
                // Show Lyrics if past start time
                if (now >= firstLyricTime - 0.3) {
                    if (isFading) {
                        textOpacity -= 0.3;
                        if (textOpacity <= 0) { textOpacity = 0; displayedText = targetText; isFading = false; }
                    } else if (textOpacity < 1) { textOpacity += 0.3; }
                    
                    if (displayedText) {
                        ctx.globalAlpha = Math.max(0, Math.min(1, textOpacity));
                        ctx.font = `bold ${getFitSize(displayedText.toUpperCase(), canvas.width * 0.9, 110)}px "${customFontName}"`;
                        ctx.fillText(displayedText.toUpperCase(), canvas.width/2, canvas.height/2);
                        ctx.globalAlpha = 1;
                    }
                } 
                // Show Intro Card (Quick Cutoff)
                else if (now > (WIPE_START + 400) / 1000 && (firstLyricTime - now > 0.8)) {
                    const tStr = (document.getElementById('title').value || "LOFT").toUpperCase();
                    const aStr = (document.getElementById('artist').value || "STUDIO").toUpperCase();
                    ctx.font = `bold ${getFitSize(tStr, canvas.width * 0.85, 170)}px "${customFontName}"`;
                    ctx.fillText(tStr, canvas.width/2, canvas.height/2 - 40);
                    ctx.font = `300 ${getFitSize(aStr, canvas.width * 0.7, 65)}px "${customFontName}"`;
                    ctx.fillText(aStr, canvas.width/2, canvas.height/2 + 90);
                }
            }

            // White Sweep Intro
            if (wipeProgress < 1) {
                ctx.save();
                ctx.translate(-canvas.width * 4.8 * wipeProgress, 0);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(-canvas.width, -canvas.height, canvas.width * 5, canvas.height * 3);
                ctx.restore();
            }

            requestAnimationFrame(render);
        }
        render();

        audioPlayer.ontimeupdate = () => {
            const now = audioPlayer.currentTime;
            let foundIndex = -1;
            for (let i = 0; i < syncedLyrics.length; i++) { if (syncedLyrics[i].time <= now) foundIndex = i; else break; }
            if (foundIndex !== -1 && foundIndex !== currentLineIndex) { currentLineIndex = foundIndex; targetText = syncedLyrics[foundIndex].text; isFading = true; }
        };

        document.getElementById('audioUpload').onchange = (e) => { 
            const file = e.target.files[0]; 
            if (file) audioPlayer.src = URL.createObjectURL(file); 
        };
    </script>
</body>
</html>
