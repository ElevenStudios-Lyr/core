<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFT Lyric Studio - Auto Export</title>
    <style>
        :root { --accent: #ff85a2; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        #canvas-container { position: relative; box-shadow: 0 25px 70px rgba(0,0,0,0.9); margin-bottom: 25px; border-radius: 15px; overflow: hidden; border: 2px solid #222; background: #1a1012; }
        canvas { display: block; background: #000; }
        .dashboard { background: #111; padding: 25px; border-radius: 20px; width: 850px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; border: 1px solid #333; }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .label { font-size: 11px; color: #777; min-width: 90px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], input[type="file"] { background: #1a1a1a; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; flex: 1; font-size: 14px; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #ccc; min-width: 140px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--accent); }
        button { padding: 15px; border: none; color: #000; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 10px; flex: 1; transition: 0.3s; }
        #confirmBtn { background: var(--accent); }
        #recordBtn { background: #e74c3c; color: white; }
        #recordBtn.recording { background: #fff; color: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); margin-top: 10px; }
        .status { font-size: 13px; color: #777; text-align: center; }

        /* New Results List Styling */
        #lyrics-results { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            max-height: 180px; overflow-y: auto; padding: 5px; 
            background: #0a0a0a; border-radius: 12px; margin-top: 5px;
        }
        .lyric-card { 
            background: #161616; padding: 12px; border-radius: 8px; border: 1px solid #222;
            cursor: pointer; position: relative; font-size: 13px; transition: 0.2s;
        }
        .lyric-card:hover { border-color: #444; }
        .lyric-card.active { border-color: var(--accent); background: #1f1417; }
        .lyric-card .meta { font-size: 11px; color: #666; display: flex; justify-content: space-between; margin-top: 4px; }
        .lyric-card.active::after { content: 'USING'; position: absolute; right: 8px; top: 8px; font-size: 9px; background: var(--accent); color: black; padding: 2px 4px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="previewCanvas" width="1280" height="720" style="width: 800px; height: 450px;"></canvas>
    </div>

    <div class="dashboard">
        <div class="input-row">
            <span class="label">Font File</span>
            <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
            <label class="checkbox-container">
                <input type="checkbox" id="blurToggle"> Blur Background
            </label>
        </div>
        <div class="input-row"><span class="label">Background</span><input type="file" id="bgUpload" accept="image/*"></div>
        <div class="input-row"><span class="label">Audio File</span><input type="file" id="audioUpload" accept="audio/*"></div>
        <div class="input-row">
            <input type="text" id="artist" placeholder="Artist Name">
            <input type="text" id="title" placeholder="Song Title">
        </div>
        
        <div class="input-row">
            <button id="confirmBtn">Sync Lyrics</button>
            <button id="recordBtn">Start Export</button>
        </div>

        <!-- NEW LYRICS SELECTION LIST -->
        <div id="lyrics-results"></div>

        <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
        <div class="status" id="statusMsg">Ready.</div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audioPlayer');
        const recordBtn = document.getElementById('recordBtn');
        const statusMsg = document.getElementById('statusMsg');
        const blurToggle = document.getElementById('blurToggle');
        const bgUpload = document.getElementById('bgUpload');
        const fontUpload = document.getElementById('fontUpload');
        const lyricsResults = document.getElementById('lyrics-results');

        const logo = new Image(); logo.src = 'ic.png';
        
        const INTRO_DUR = 800, STAY_DUR = 2500, WIPE_DELAY = 600, OUTRO_START = INTRO_DUR + STAY_DUR;
        const WIPE_START = OUTRO_START - WIPE_DELAY, LOGO_OUTRO = 700, WIPE_DUR = 1400;

        const memphisShapes = [];
        for (let i = 0; i < 180; i++) {
            memphisShapes.push({
                x: Math.random() * 4500, y: Math.random() * 1600 - 400,
                size: Math.random() * 20 + 15, type: Math.floor(Math.random() * 6),
                vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.04
            });
        }

        let syncedLyrics = [], currentLineIndex = -1, displayedText = "", targetText = "", textOpacity = 0, isFading = false;
        let customFontName = 'sans-serif', bgImg = new Image();
        bgImg.crossOrigin = "anonymous"; bgImg.src = 'https://vip-go.premiumbeat.com/wp-content/uploads/2018/10/pink-sky-cover.jpg';

        function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
        function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }
        function easeInOutQuart(x) { return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; }

        function formatDuration(sec) {
            const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getFitSize(text, maxW, baseSize) {
            let size = baseSize; ctx.font = `bold ${size}px "${customFontName}"`;
            while (ctx.measureText(text).width > maxW && size > 20) { size -= 2; ctx.font = `bold ${size}px "${customFontName}"`; }
            return size;
        }

        function resetPreviewState() { currentLineIndex = -1; displayedText = ""; targetText = ""; textOpacity = 0; isFading = false; }
        audioPlayer.onseeking = () => { if (audioPlayer.currentTime < 1) resetPreviewState(); };

        let mediaRecorder, recordedChunks = [];

        // Updated parsing function
        function parseLRC(lrcContent, resultId) {
            syncedLyrics = lrcContent.split('\n').map(line => {
                const m = line.match(/\[(\d+):(\d+\.\d+)\]/);
                return m ? { time: (parseFloat(m[1])*60 + parseFloat(m[2])), text: line.replace(/\[.*\]/, '').replace(/[^a-zA-Z0-9\s']/g, '').trim() } : null;
            }).filter(x => x && x.text !== "");
            
            // Highlight selected in UI
            document.querySelectorAll('.lyric-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`res-${resultId}`)?.classList.add('active');
            
            statusMsg.innerText = "Lyrics Loaded!";
            resetPreviewState();
        }

        function render() {
            const elapsed = audioPlayer.currentTime * 1000;
            const nowSeconds = audioPlayer.currentTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let wipeProgress = 0;
            if (elapsed > WIPE_START) wipeProgress = easeInOutSine(Math.min(1, (elapsed - WIPE_START) / WIPE_DUR));

            if (wipeProgress > 0) {
                ctx.save();
                if (blurToggle.checked) ctx.filter = 'blur(8px)';
                const canvasAspect = canvas.width / canvas.height, imgAspect = bgImg.width / bgImg.height;
                let dW, dH;
                if (imgAspect > canvasAspect) { dH = canvas.height; dW = dH * imgAspect; }
                else { dW = canvas.width; dH = dW / imgAspect; }
                ctx.drawImage(bgImg, (canvas.width - dW) / 2, (canvas.height - dH) / 2, dW, dH);
                ctx.restore();
                
                const logoWipeAlpha = Math.min(1, (elapsed - (WIPE_START + 400)) / 1000);
                if (logoWipeAlpha > 0) {
                    ctx.save();
                    const logoSize = 80, margin = 15;
                    const logoX = canvas.width - logoSize - margin, logoY = canvas.height - logoSize - margin;
                    const spinCycle = 5000, spinDuration = 1500, cycleTime = elapsed % spinCycle;
                    let rotation = 0, popScale = 1;
                    if (cycleTime < spinDuration) {
                        const t = cycleTime / spinDuration;
                        rotation = easeInOutQuart(t) * (Math.PI * 2 * 3);
                        popScale = 1 + Math.sin(t * Math.PI) * 0.1;
                    }
                    ctx.translate(logoX + logoSize/2, logoY + logoSize/2);
                    ctx.rotate(rotation); ctx.scale(popScale, popScale);
                    ctx.globalAlpha = 0.9; ctx.filter = 'brightness(100)'; 
                    ctx.shadowColor = "rgba(0,0,0,0.4)"; ctx.shadowBlur = 10;
                    if (logo.complete) ctx.drawImage(logo, -logoSize/2, -logoSize/2, logoSize, logoSize);
                    ctx.restore();
                }

                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 20;

                const firstLyricTime = (syncedLyrics.length > 0 ? syncedLyrics[0].time : 9999);
                const timeUntilLyrics = firstLyricTime - nowSeconds;

                if (nowSeconds >= firstLyricTime - 0.3) {
                    if (isFading) {
                        textOpacity -= 0.3; 
                        if (textOpacity <= 0) { textOpacity = 0; displayedText = targetText; isFading = false; }
                    } else if (textOpacity < 1) { textOpacity += 0.3; }
                    
                    if (displayedText) {
                        ctx.globalAlpha = Math.max(0, Math.min(1, textOpacity));
                        ctx.font = `bold ${getFitSize(displayedText.toUpperCase(), canvas.width * 0.92, 115)}px "${customFontName}"`;
                        ctx.fillText(displayedText.toUpperCase(), canvas.width/2, canvas.height/2);
                        ctx.globalAlpha = 1;
                    }
                } 
                else if (nowSeconds > (WIPE_START + 300) / 1000 && timeUntilLyrics > 0.6) {
                    const tStr = (document.getElementById('title').value || "LOFT STUDIO").toUpperCase();
                    const aStr = (document.getElementById('artist').value || "PRODUCER").toUpperCase();
                    ctx.font = `bold ${getFitSize(tStr, canvas.width * 0.9, 180)}px "${customFontName}"`;
                    ctx.fillText(tStr, canvas.width/2, canvas.height/2 - 45);
                    ctx.font = `300 ${getFitSize(aStr, canvas.width * 0.8, 70)}px "${customFontName}"`;
                    ctx.fillText(aStr, canvas.width/2, canvas.height/2 + 85);
                }
            }

            if (wipeProgress < 1) {
                ctx.save();
                const totalTravel = canvas.width * 4.8;
                ctx.translate(-totalTravel * wipeProgress, 0);
                ctx.rotate(-15 * Math.PI / 180);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(-canvas.width, -canvas.height * 3, canvas.width * 4.85, canvas.height * 10);
                ctx.lineWidth = 4; ctx.strokeStyle = '#000000'; ctx.fillStyle = '#000000';
                memphisShapes.forEach(s => {
                    ctx.save(); ctx.translate(s.x - canvas.width, s.y); ctx.rotate(s.rotation); ctx.beginPath();
                    if(s.type === 0){ const hs=s.size/2; ctx.moveTo(-hs,-hs); ctx.lineTo(hs,hs); ctx.moveTo(hs,-hs); ctx.lineTo(-hs,hs); ctx.stroke(); }
                    else if(s.type === 1){ ctx.arc(0,0,s.size/2,0,Math.PI*2); ctx.stroke(); }
                    else if(s.type === 4){ ctx.fillRect(-2,-2,4,4); }
                    else { ctx.moveTo(0,-s.size/2); ctx.lineTo(s.size/2,s.size/2); ctx.lineTo(-s.size/2,s.size/2); ctx.closePath(); ctx.stroke(); }
                    ctx.restore(); s.x += s.vx; s.y += s.vy; s.rotation += s.rotSpeed;
                    if (s.x > canvas.width * 4.8) s.x = 0;
                });
                ctx.fillStyle = '#000000'; ctx.fillRect(canvas.width * 3.8, -canvas.height * 3, 800, canvas.height * 10);
                ctx.restore();

                if (elapsed < OUTRO_START + LOGO_OUTRO) {
                    let op = 0, sc = 1.0;
                    if (elapsed < INTRO_DUR) { let t = easeOutCubic(elapsed/INTRO_DUR); op = t; sc = 0.5 + 0.45 * t; }
                    else if (elapsed < OUTRO_START) { op = 1; sc = 0.95 + (0.07 * ((elapsed - INTRO_DUR)/STAY_DUR)); }
                    else { let t = (elapsed - OUTRO_START)/LOGO_OUTRO; op = Math.max(0, 1-t); sc = 1.02 - (0.05*t); }
                    ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(sc, sc); ctx.globalAlpha = op;
                    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 20;
                    ctx.filter = 'brightness(0)'; 
                    if (logo.complete) ctx.drawImage(logo, -160, -160, 320, 320);
                    ctx.restore();
                }
            }

            const fadeStart = audioPlayer.duration - 1.5;
            if (audioPlayer.currentTime > fadeStart) {
                const fadeProgress = (audioPlayer.currentTime - fadeStart) / 1.5;
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, fadeProgress)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            requestAnimationFrame(render);
        }
        render();

        bgUpload.onchange = (e) => {
            const file = e.target.files[0];
            if (file) { const reader = new FileReader(); reader.onload = (event) => bgImg.src = event.target.result; reader.readAsDataURL(file); }
        };
        fontUpload.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) { const fontFace = new FontFace('UserCustomFont', await file.arrayBuffer()); await fontFace.load(); document.fonts.add(fontFace); customFontName = 'UserCustomFont'; }
        };

        document.getElementById('confirmBtn').onclick = async () => {
            const artist = document.getElementById('artist').value.trim(), title = document.getElementById('title').value.trim();
            if(!title) return alert("Enter song title");
            statusMsg.innerText = "Searching LRCLIB...";
            lyricsResults.innerHTML = "";

            try {
                const res = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
                const data = await res.json();
                
                const validOnes = data.filter(d => d.syncedLyrics);
                if (validOnes.length === 0) {
                    statusMsg.innerText = "No synced lyrics found.";
                    return;
                }

                validOnes.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'lyric-card';
                    card.id = `res-${item.id}`;
                    card.innerHTML = `
                        <strong>${item.trackName}</strong>
                        <div class="meta">
                            <span>${item.artistName}</span>
                            <span>${formatDuration(item.duration)}</span>
                        </div>
                    `;
                    card.onclick = () => parseLRC(item.syncedLyrics, item.id);
                    lyricsResults.appendChild(card);
                    if (idx === 0) parseLRC(item.syncedLyrics, item.id);
                });
                statusMsg.innerText = "Select a lyric version below.";
            } catch (e) { statusMsg.innerText = "Sync failed."; }
        };

        audioPlayer.ontimeupdate = () => {
            const now = audioPlayer.currentTime;
            if (now < 0.2 && currentLineIndex !== -1) resetPreviewState();
            let foundIndex = -1;
            for (let i = 0; i < syncedLyrics.length; i++) { if (syncedLyrics[i].time <= now) foundIndex = i; else break; }
            if (foundIndex !== -1 && foundIndex !== currentLineIndex) { currentLineIndex = foundIndex; targetText = syncedLyrics[foundIndex].text; isFading = true; }
            
            if (mediaRecorder && mediaRecorder.state === "recording" && audioPlayer.ended) {
                mediaRecorder.stop();
                recordBtn.innerText = "Start Export";
                recordBtn.classList.remove('recording');
                statusMsg.innerText = "Export Complete!";
            }
        };

        recordBtn.onclick = async () => {
            if (mediaRecorder?.state === "recording") {
                mediaRecorder.stop();
                audioPlayer.pause();
                recordBtn.innerText = "Start Export";
                recordBtn.classList.remove('recording');
            } else {
                if (!audioPlayer.src) { alert("Please upload an audio file first!"); return; }
                statusMsg.innerText = "Initializing Record...";
                recordedChunks = [];
                resetPreviewState();
                audioPlayer.currentTime = 0;
                const canvasStream = canvas.captureStream(60); 
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaElementSource(audioPlayer);
                const destination = audioContext.createMediaStreamDestination();
                source.connect(destination);
                source.connect(audioContext.destination); 
                const combinedStream = new MediaStream([...canvasStream.getVideoTracks(), ...destination.stream.getAudioTracks()]);
                let options = { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12000000 };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) options = { mimeType: 'video/mp4;codecs=avc1', videoBitsPerSecond: 12000000 };
                mediaRecorder = new MediaRecorder(combinedStream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: options.mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${document.getElementById('title').value || 'loft_video'}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                };
                mediaRecorder.start();
                audioPlayer.play();
                recordBtn.innerText = "Recording...";
                recordBtn.classList.add('recording');
                statusMsg.innerText = "Exporting... Please do not close this tab.";
            }
        };

        document.getElementById('audioUpload').onchange = (e) => { const file = e.target.files[0]; if (file) { audioPlayer.src = URL.createObjectURL(file); resetPreviewState(); } };
    </script>
</body>
</html>
