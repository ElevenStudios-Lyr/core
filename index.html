<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Studios | Dashboard Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --panel-light: #121212;
            --accent: #ffffff;
            --glow: rgba(255, 255, 255, 0.25);
            --border: #222222;
            --text-main: #ffffff;
            --text-dim: #777777;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-header {
            width: 820px;
            margin-bottom: 20px;
            text-align: left;
        }

        .header-text {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--glow);
        }

        .header-text span { color: var(--text-dim); font-weight: 400; margin: 0 5px; }

        .workspace {
            width: 820px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-section {
            background: var(--panel);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 0 15px var(--glow);
        }

        canvas#previewCanvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            display: block;
            border: 1px solid var(--border);
        }

        .custom-player {
            margin-top: 15px;
            background: var(--panel-light);
            padding: 0 20px;
            height: 65px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border);
        }

        .play-btn {
            background: var(--accent);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: #333;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -4px;
        }

        .time-info {
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            margin-top: 4px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
        }

        .tag {
            font-size: 9px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .file-wrapper { position: relative; }
        .file-wrapper input { position: absolute; opacity: 0; width: 1px; }

        .custom-file-btn {
            display: block;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 12px;
            border-radius: 8px;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
        }

        .action-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            background: var(--accent);
            color: #000;
        }

        .recording-active {
            background: #ff0000 !important;
            color: #fff !important;
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .step-btn {
            background: var(--accent);
            color: #000;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .val { color: var(--accent); font-weight: 800; font-family: monospace; }

        #thumbPreviewCanvas {
            width: 240px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #000;
            display: block;
            margin: 10px auto 0;
        }

        .lyrics-container {
            max-height: 250px;
            overflow-y: auto;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
        }
        
        .track-selection-item {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1a1a1a;
            background: var(--panel-light);
            margin-bottom: 6px;
            cursor: pointer;
        }

        .track-selection-item:hover { border-color: #555; }
        .track-selection-item.selected-track { border-color: var(--accent) !important; }
        .track-title-line { font-size: 13px; font-weight: 700; color: #fff; }
        .track-meta-line { font-size: 11px; color: var(--text-dim); }

        .offset-controls-wrapper {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 20px;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="header-text">DASHBOARD <span>|</span> ELEVEN STUDIOS</div>
    </div>

    <div class="workspace">
        <div class="preview-section">
            <canvas id="previewCanvas" width="1280" height="720"></canvas>
            <div class="custom-player">
                <button class="play-btn" id="playToggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="progress-container">
                    <input type="range" id="progressBar" value="0" min="0" max="100">
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span id="durationTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="grid-2">
                <div><span class="tag">Song Title</span><input type="text" id="songTitle" placeholder="Untitled"></div>
                <div><span class="tag">Artist Name</span><input type="text" id="artistName" placeholder="Untitled"></div>
            </div>
        </div>

        <div class="card">
            <span class="tag">Upload Assets</span>
            <div class="asset-grid">
                <div class="file-wrapper"><label for="audioUpload" class="custom-file-btn" id="audioLabel">AUDIO</label><input type="file" id="audioUpload" accept="audio/*"></div>
                <div class="file-wrapper"><label for="bgUpload" class="custom-file-btn" id="bgLabel">BACKGROUND</label><input type="file" id="bgUpload" accept="image/*"></div>
                <div class="file-wrapper"><label for="fontUpload" class="custom-file-btn" id="fontLabel">FONT</label><input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2"></div>
            </div>
        </div>

        <div class="card">
            <span class="tag">Offset Layout Engine</span>
            <div class="offset-controls-wrapper">
                <div>
                    <span class="tag">Default Offset</span>
                    <input type="number" id="defaultOffsetInput" value="0.0" step="0.1">
                </div>
                <div>
                    <span class="tag">Fine Adjust: <span id="sliderValueDisplay">0.0s</span></span>
                    <input type="range" id="fineOffsetSlider" min="-5" max="5" step="0.1" value="0">
                    <div id="totalOffsetDisplay" style="font-size: 11px; color: var(--accent); margin-top: 5px;">TOTAL: 0.0s</div>
                </div>
            </div>
        </div>

        <div class="card">
            <span class="tag">FPS Control</span>
            <select id="fpsSelect">
                <option value="24">24 FPS</option>
                <option value="30" selected>30 FPS</option>
                <option value="60">60 FPS</option>
            </select>
        </div>

        <div class="action-center">
            <button class="btn" id="recordBtn" onclick="toggleRecord()">Record</button>
            <button class="btn" id="fetchBtn">Fetch Lyrics</button>
            <button class="btn" id="thumbBtn">Thumbnail</button>
        </div>

        <div class="card" style="text-align: center;">
            <span class="tag">Thumbnail Preview</span>
            <canvas id="thumbPreviewCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="card">
            <div class="grid-2">
                <div class="stepper" id="songStepper" style="justify-content: space-between;">
                    <span class="tag" style="margin:0;">Song Size</span>
                    <button class="step-btn">−</button><span class="val" id="songSizeVal">210</span><button class="step-btn">+</button>
                </div>
                <div class="stepper" id="artistStepper" style="justify-content: space-between;">
                    <span class="tag" style="margin:0;">Artist Size</span>
                    <button class="step-btn">−</button><span class="val" id="artistSizeVal">60</span><button class="step-btn">+</button>
                </div>
            </div>
        </div>

        <div class="card" id="lyricsDisplayCard" style="display: none;">
            <span class="tag">Select Track</span>
            <div id="lyricsWindow" class="lyrics-container"></div>
        </div>
    </div>

    <script>
        // --- ASSETS & STATE ---
        const canvas = document.getElementById('previewCanvas'), ctx = canvas.getContext('2d');
        const songInput = document.getElementById('songTitle'), artistInput = document.getElementById('artistName');
        let currentBg = new Image(), logoImg = new Image(), customFont = "sans-serif";
        let activeLyricLines = [], targetLyricText = "", currentDisplayedLyric = "", lyricAlpha = 0, animState = "idle";
        let songFontSizeSetting = 210, artistFontSizeSetting = 60, driftTime = 0, lastSpinTrigger = 0;
        let audioTrack = new Audio(), isAudioLoaded = false;

        currentBg.src = 'assets/stock_bg.jpg';
        logoImg.src = 'assets/es_ic.png';

        document.getElementById('bgUpload').onchange = (e) => {
            currentBg.src = URL.createObjectURL(e.target.files[0]);
            currentBg.onload = renderThumbnailPreview;
        };

        document.getElementById('fontUpload').onchange = (e) => {
            const font = new FontFace('CustomCanvasFont', `url(${URL.createObjectURL(e.target.files[0])})`);
            font.load().then(f => { document.fonts.add(f); customFont = "CustomCanvasFont"; renderThumbnailPreview(); });
        };

        // --- ANIMATION LOOP (SMOOTHING) ---
        function animate(timestamp) {
            driftTime += 0.025;
            if (!lastSpinTrigger) lastSpinTrigger = timestamp;
            const elapsed = timestamp - lastSpinTrigger;
            if (elapsed >= 5000) lastSpinTrigger = timestamp;

            let logoRot = 0;
            if (elapsed < 1500) {
                const t = elapsed / 1500;
                logoRot = (1 - Math.pow(1 - t, 3)) * (Math.PI * 8);
            }

            const offX = Math.cos(driftTime * 0.9) * 15;
            const offY = Math.sin(driftTime * 1.2) * 10;
            const scale = 1 + Math.sin(driftTime * 1.8) * 0.02;

            updateLyrics();
            handleTransitions();
            draw(offX, offY, scale, logoRot);
            requestAnimationFrame(animate);
        }

        function draw(x, y, s, rot) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Background & Fade-out logic
            let globalFade = 1.0;
            if (audioTrack.duration) {
                const remaining = audioTrack.duration - audioTrack.currentTime;
                if (remaining < 3) globalFade = remaining / 3;
            }
            ctx.globalAlpha = globalFade;

            if (currentBg.complete) ctx.drawImage(currentBg, 0, 0, 1280, 720);

            // Logo
            if (logoImg.complete) {
                ctx.save(); ctx.translate(1205, 75); ctx.rotate(rot);
                ctx.drawImage(logoImg, -42.5, -42.5, 85, 85); ctx.restore();
            }

            // LYRICS (Optimized for smoothness)
            if (currentDisplayedLyric) {
                ctx.save();
                ctx.translate(640 + x, 360 + y);
                // Use globalAlpha for the transition fade to prevent flicker
                ctx.globalAlpha = lyricAlpha * globalFade;
                
                let fontSize = 150 * s;
                ctx.font = `${fontSize}px ${customFont}`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                
                // Reduced shadow complexity for performance
                ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 30;

                let text = currentDisplayedLyric.toUpperCase();
                let metrics = ctx.measureText(text);
                if (metrics.width > 1100) {
                    fontSize *= (1100 / metrics.width);
                    ctx.font = `${fontSize}px ${customFont}`;
                }
                ctx.fillText(text, 0, 0);
                ctx.restore();
            }
            ctx.globalAlpha = 1.0;
        }

        function handleTransitions() {
            if (currentDisplayedLyric !== targetLyricText && animState === "idle") animState = "fading_out";
            
            if (animState === "fading_out") {
                lyricAlpha -= 0.12; // Faster, snappier fade
                if (lyricAlpha <= 0) {
                    lyricAlpha = 0;
                    currentDisplayedLyric = targetLyricText;
                    animState = "fading_in";
                }
            } else if (animState === "fading_in") {
                lyricAlpha += 0.12;
                if (lyricAlpha >= 1) { lyricAlpha = 1; animState = "idle"; }
            }
        }

        // --- THUMBNAIL ENGINE (FIXED) ---
        const tCanvas = document.getElementById('thumbPreviewCanvas'), tCtx = tCanvas.getContext('2d');
        function renderThumbnailPreview() {
            tCtx.clearRect(0,0,1280,720);
            if (currentBg.complete) tCtx.drawImage(currentBg, 0, 0, 1280, 720);
            if (logoImg.complete) tCtx.drawImage(logoImg, 1165, 30, 85, 85);

            const title = (songInput.value || "SONG TITLE").toUpperCase();
            const artist = (artistInput.value || "ARTIST NAME").toUpperCase();

            tCtx.save();
            tCtx.textAlign = "center"; tCtx.fillStyle = "white";
            tCtx.shadowBlur = 35; tCtx.shadowColor = "black";

            // Calculate heights for perfect centering
            tCtx.font = `${songFontSizeSetting}px ${customFont}`;
            let sm = tCtx.measureText(title); 
            let sH = sm.actualBoundingBoxAscent + sm.actualBoundingBoxDescent;
            
            tCtx.font = `${artistFontSizeSetting}px ${customFont}`;
            let am = tCtx.measureText(artist); 
            let aH = am.actualBoundingBoxAscent + am.actualBoundingBoxDescent;

            const totalH = sH + 40 + aH;
            const startY = (720 - totalH) / 2 + sH;

            tCtx.font = `${songFontSizeSetting}px ${customFont}`;
            tCtx.fillText(title, 640, startY);
            tCtx.font = `${artistFontSizeSetting}px ${customFont}`;
            tCtx.fillText(artist, 640, startY + 40 + aH);
            tCtx.restore();
        }

        // --- RECORDING ---
        let mediaRecorder = null, recordedChunks = [];
        function toggleRecord() {
            if (!isRecording) {
                if (!isAudioLoaded) return alert("Select audio first");
                recordedChunks = [];
                const stream = canvas.captureStream(parseInt(document.getElementById('fpsSelect').value));
                
                if (!audioContextInstance) {
                    audioContextInstance = new AudioContext();
                    const source = audioContextInstance.createMediaElementSource(audioTrack);
                    mediaStreamDestinationNode = audioContextInstance.createMediaStreamDestination();
                    source.connect(mediaStreamDestinationNode);
                    source.connect(audioContextInstance.destination);
                }
                stream.addTrack(mediaStreamDestinationNode.stream.getAudioTracks()[0]);

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 8000000 });
                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `${songInput.value || 'Eleven'}.mp4`; a.click();
                };
                mediaRecorder.start();
                isRecording = true; document.getElementById('recordBtn').classList.add('recording-active');
                audioTrack.currentTime = 0; audioTrack.play();
            } else {
                mediaRecorder.stop(); isRecording = false;
                document.getElementById('recordBtn').classList.remove('recording-active');
            }
        }
        let isRecording = false, audioContextInstance, mediaStreamDestinationNode;

        // --- UI UTILS ---
        document.getElementById('audioUpload').onchange = (e) => {
            audioTrack.src = URL.createObjectURL(e.target.files[0]);
            isAudioLoaded = true; document.getElementById('audioLabel').innerText = "✓ READY";
        };
        document.getElementById('playToggle').onclick = () => { audioTrack.paused ? audioTrack.play() : audioTrack.pause(); };
        audioTrack.ontimeupdate = () => {
            document.getElementById('progressBar').value = (audioTrack.currentTime / audioTrack.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audioTrack.currentTime);
        };
        audioTrack.onloadedmetadata = () => document.getElementById('durationTime').innerText = formatTime(audioTrack.duration);
        function formatTime(s) { const m = Math.floor(s/60), sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }

        const fine = document.getElementById('fineOffsetSlider'), def = document.getElementById('defaultOffsetInput');
        function getOffset() {
            const val = (parseFloat(def.value)||0) + (parseFloat(fine.value)||0);
            document.getElementById('sliderValueDisplay').innerText = fine.value + "s";
            document.getElementById('totalOffsetDisplay').innerText = "TOTAL: " + val.toFixed(1) + "s";
            return val;
        }

        document.getElementById('fetchBtn').onclick = () => {
            const q = `https://lrclib.net/api/search?track_name=${encodeURIComponent(songInput.value)}&artist_name=${encodeURIComponent(artistInput.value)}`;
            document.getElementById('lyricsDisplayCard').style.display = "block";
            fetch(q).then(r => r.json()).then(data => {
                const win = document.getElementById('lyricsWindow'); win.innerHTML = "";
                data.forEach(t => {
                    const d = document.createElement('div'); d.className = "track-selection-item";
                    d.innerHTML = `<div class="track-title-line">${t.trackName.toUpperCase()}</div><div class="track-meta-line">${t.artistName}</div>`;
                    d.onclick = () => { parseLrc(t.syncedLyrics || t.plainLyrics); document.querySelectorAll('.track-selection-item').forEach(i=>i.classList.remove('selected-track')); d.classList.add('selected-track'); };
                    win.appendChild(d);
                });
            });
        };

        function parseLrc(lrc) {
            activeLyricLines = []; if(!lrc) return;
            lrc.split('\n').forEach(l => {
                const m = l.match(/\[(\d+):(\d+)\.(\d+)\]/);
                if (m) activeLyricLines.push({ time: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/100, text: l.replace(/\[.*?\]/g, '').trim() });
            });
        }

        function updateLyrics() {
            const t = audioTrack.currentTime + getOffset();
            let m = "";
            for (let line of activeLyricLines) { if (t >= line.time) m = line.text; else break; }
            targetLyricText = m;
        }

        function initStepper(id, update) {
            const s = document.getElementById(id);
            s.querySelectorAll('button')[0].onclick = () => update(-5);
            s.querySelectorAll('button')[1].onclick = () => update(5);
        }
        initStepper('songStepper', (v) => { songFontSizeSetting += v; document.getElementById('songSizeVal').innerText = songFontSizeSetting; renderThumbnailPreview(); });
        initStepper('artistStepper', (v) => { artistFontSizeSetting += v; document.getElementById('artistSizeVal').innerText = artistFontSizeSetting; renderThumbnailPreview(); });

        songInput.oninput = renderThumbnailPreview;
        artistInput.oninput = renderThumbnailPreview;
        requestAnimationFrame(animate);
    </script>
</body>
</html>
