<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOFT Lyric Studio</title>
    <style>
        /* Loading your local font */
        @font-face {
            font-family: 'DefaultLOFT';
            src: url('defaultfont.otf');
        }

        :root { --accent: #ff85a2; --bg: #050505; }
        body { 
            background-color: var(--bg); 
            color: white; 
            font-family: 'DefaultLOFT', 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        
        /* Preview Canvas Styling */
        #canvas-wrapper { 
            position: relative; 
            box-shadow: 0 25px 70px rgba(0,0,0,0.9); 
            margin-bottom: 10px; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 2px solid #222; 
            background: #000;
            width: 800px;
        }
        canvas { display: block; width: 100%; height: auto; }

        /* Dedicated Player Bar below preview */
        #player-bar {
            width: 800px;
            background: #111;
            border-radius: 10px;
            padding: 5px;
            border: 1px solid #333;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        audio { 
            width: 100%; 
            height: 40px;
            filter: invert(100%) hue-rotate(180deg) brightness(1.5); 
        }

        .dashboard { 
            background: #111; 
            padding: 25px; 
            border-radius: 20px; 
            width: 800px; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            box-sizing: border-box; 
            border: 1px solid #333; 
        }

        .input-row { display: flex; gap: 12px; align-items: center; }
        .label { font-size: 11px; color: #777; min-width: 90px; text-transform: uppercase; letter-spacing: 1px; }

        input[type="text"], input[type="file"] { 
            background: #1a1a1a; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; flex: 1; font-size: 14px; font-family: inherit;
        }

        .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #ccc; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }

        button { 
            padding: 15px; border: none; color: #000; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 10px; flex: 1; transition: 0.3s; font-family: inherit;
        }
        #confirmBtn { background: var(--accent); }
        #recordBtn { background: #e74c3c; color: white; }
        #recordBtn.recording { background: #fff; color: #e74c3c; animation: pulse 1s infinite; }

        @keyframes pulse { 50% { opacity: 0.5; } }

        #lyrics-results { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 150px; overflow-y: auto; padding: 5px; background: #0a0a0a; border-radius: 12px;
        }
        .lyric-card { background: #161616; padding: 10px; border-radius: 8px; border: 1px solid #222; cursor: pointer; font-size: 13px; }
        .lyric-card.active { border-color: var(--accent); background: #1f1417; }
        
        .status { font-size: 12px; color: #555; text-align: center; margin-top: 5px; }
        input[type="range"] { flex: 2; accent-color: var(--accent); cursor: pointer; }
        #offsetVal { min-width: 45px; font-size: 13px; font-family: monospace; color: var(--accent); }
    </style>
</head>
<body>

    <div id="canvas-wrapper">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
    </div>

    <!-- Player moved outside/below the preview box -->
    <div id="player-bar">
        <audio id="audioPlayer" controls crossorigin="anonymous"></audio>
    </div>

    <div class="dashboard">
        <div class="input-row">
            <span class="label">Custom Font</span>
            <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
            <label class="checkbox-container">
                <input type="checkbox" id="blurToggle"> Blur BG
            </label>
        </div>
        
        <div class="input-row"><span class="label">Background</span><input type="file" id="bgUpload" accept="image/*"></div>
        <div class="input-row"><span class="label">Audio File</span><input type="file" id="audioUpload" accept="audio/*"></div>

        <div class="input-row">
            <input type="text" id="artist" placeholder="Artist Name">
            <input type="text" id="title" placeholder="Song Title">
        </div>

        <div class="input-row">
            <span class="label">Lyric Offset</span>
            <input type="range" id="lyricOffset" min="-2.0" max="2.0" step="0.1" value="0">
            <span id="offsetVal">0.0s</span>
        </div>
        
        <div class="input-row">
            <button id="confirmBtn">Sync & Search</button>
            <button id="recordBtn">Start Export</button>
        </div>

        <div id="lyrics-results"></div>
        <div class="status" id="statusMsg">Font: Default (defaultfont.otf)</div>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const audioPlayer = document.getElementById('audioPlayer');
        const recordBtn = document.getElementById('recordBtn');
        const statusMsg = document.getElementById('statusMsg');
        const blurToggle = document.getElementById('blurToggle');
        const bgUpload = document.getElementById('bgUpload');
        const fontUpload = document.getElementById('fontUpload');
        const lyricsResults = document.getElementById('lyrics-results');
        const offsetSlider = document.getElementById('lyricOffset');
        const offsetDisplay = document.getElementById('offsetVal');

        const logo = new Image(); logo.src = 'ic.png';
        
        const INTRO_DUR = 800, STAY_DUR = 2500, WIPE_DELAY = 600, OUTRO_START = INTRO_DUR + STAY_DUR;
        const WIPE_START = OUTRO_START - WIPE_DELAY, LOGO_OUTRO = 700, WIPE_DUR = 1400;

        const memphisShapes = [];
        for (let i = 0; i < 180; i++) {
            memphisShapes.push({
                x: Math.random() * 4500, y: Math.random() * 1600 - 400,
                size: Math.random() * 20 + 15, type: Math.floor(Math.random() * 6),
                vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                rotation: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.04
            });
        }

        let syncedLyrics = [], currentLineIndex = -1, displayedText = "", targetText = "", textOpacity = 0, isFading = false;
        let customFontName = 'DefaultLOFT', bgImg = new Image();
        bgImg.crossOrigin = "anonymous"; bgImg.src = 'https://vip-go.premiumbeat.com/wp-content/uploads/2018/10/pink-sky-cover.jpg';

        offsetSlider.oninput = () => {
            let val = parseFloat(offsetSlider.value);
            offsetDisplay.innerText = (val > 0 ? "+" : "") + val.toFixed(1) + "s";
        };

        function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
        function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }
        function easeInOutQuart(x) { return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; }

        function getFitSize(text, maxW, baseSize) {
            let size = baseSize; ctx.font = `bold ${size}px "${customFontName}"`;
            while (ctx.measureText(text).width > maxW && size > 20) { size -= 2; ctx.font = `bold ${size}px "${customFontName}"`; }
            return size;
        }

        function resetPreviewState() { currentLineIndex = -1; displayedText = ""; targetText = ""; textOpacity = 0; isFading = false; }

        function parseLRC(lrcContent, resultId) {
            syncedLyrics = lrcContent.split('\n').map(line => {
                const m = line.match(/\[(\d+):(\d+\.\d+)\]/);
                return m ? { time: (parseFloat(m[1])*60 + parseFloat(m[2])), text: line.replace(/\[.*\]/, '').replace(/[^a-zA-Z0-9\s']/g, '').trim() } : null;
            }).filter(x => x && x.text !== "");
            document.querySelectorAll('.lyric-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`res-${resultId}`)?.classList.add('active');
            resetPreviewState();
        }

        function render() {
            const elapsed = audioPlayer.currentTime * 1000;
            const adjustedTime = audioPlayer.currentTime + parseFloat(offsetSlider.value);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let wipeProgress = 0;
            if (elapsed > WIPE_START) wipeProgress = easeInOutSine(Math.min(1, (elapsed - WIPE_START) / WIPE_DUR));

            if (wipeProgress > 0) {
                ctx.save();
                if (blurToggle.checked) ctx.filter = 'blur(8px)';
                const canvasAspect = canvas.width / canvas.height, imgAspect = bgImg.width / bgImg.height;
                let dW, dH;
                if (imgAspect > canvasAspect) { dH = canvas.height; dW = dH * imgAspect; }
                else { dW = canvas.width; dH = dW / imgAspect; }
                ctx.drawImage(bgImg, (canvas.width - dW) / 2, (canvas.height - dH) / 2, dW, dH);
                ctx.restore();
                
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                ctx.shadowColor = "rgba(0,0,0,0.7)"; ctx.shadowBlur = 20;

                const firstLyricTimeMs = (syncedLyrics.length > 0 ? syncedLyrics[0].time * 1000 : 999999);
                const shouldShowIntro = firstLyricTimeMs > (OUTRO_START + LOGO_OUTRO + 500);

                if (shouldShowIntro && elapsed > OUTRO_START && elapsed < firstLyricTimeMs - 500) {
                    const introOpacity = Math.min(1, (elapsed - OUTRO_START) / 800);
                    ctx.save(); ctx.globalAlpha = introOpacity;
                    ctx.font = `bold 80px "${customFontName}"`;
                    ctx.fillText(document.getElementById('title').value.toUpperCase() || "SONG TITLE", canvas.width/2, canvas.height/2 - 20);
                    ctx.font = `30px "${customFontName}"`; ctx.fillStyle = "rgba(255,255,255,0.7)";
                    ctx.fillText(document.getElementById('artist').value.toUpperCase() || "ARTIST NAME", canvas.width/2, canvas.height/2 + 60);
                    ctx.restore();
                }

                if (adjustedTime >= (syncedLyrics.length > 0 ? syncedLyrics[0].time : 9999) - 0.3) {
                    if (isFading) { textOpacity -= 0.3; if (textOpacity <= 0) { textOpacity = 0; displayedText = targetText; isFading = false; } }
                    else if (textOpacity < 1) { textOpacity += 0.3; }
                    if (displayedText) {
                        ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, textOpacity));
                        ctx.font = `bold ${getFitSize(displayedText.toUpperCase(), canvas.width * 0.92, 115)}px "${customFontName}"`;
                        ctx.fillText(displayedText.toUpperCase(), canvas.width/2, canvas.height/2);
                        ctx.restore();
                    }
                }

                const logoWipeAlpha = Math.min(1, (elapsed - (WIPE_START + 400)) / 1000);
                if (logoWipeAlpha > 0) {
                    ctx.save(); const logoSize = 80, margin = 15;
                    const cycleTime = elapsed % 5000;
                    let rotation = 0; if (cycleTime < 1500) rotation = easeInOutQuart(cycleTime / 1500) * (Math.PI * 6);
                    ctx.translate(canvas.width - logoSize/2 - margin, canvas.height - logoSize/2 - margin);
                    ctx.rotate(rotation); ctx.globalAlpha = 0.9; ctx.filter = 'brightness(100)'; 
                    if (logo.complete) ctx.drawImage(logo, -logoSize/2, -logoSize/2, logoSize, logoSize);
                    ctx.restore();
                }
            }

            if (wipeProgress < 1) {
                ctx.save();
                const totalTravel = canvas.width * 4.8;
                ctx.translate(-totalTravel * wipeProgress, 0); ctx.rotate(-15 * Math.PI / 180);
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-canvas.width, -canvas.height * 3, canvas.width * 4.85, canvas.height * 10);
                ctx.lineWidth = 4; ctx.strokeStyle = '#000000'; ctx.fillStyle = '#000000';
                memphisShapes.forEach(s => {
                    ctx.save(); ctx.translate(s.x - canvas.width, s.y); ctx.rotate(s.rotation); ctx.beginPath();
                    if(s.type === 0){ const hs=s.size/2; ctx.moveTo(-hs,-hs); ctx.lineTo(hs,hs); ctx.moveTo(hs,-hs); ctx.lineTo(-hs,hs); ctx.stroke(); }
                    else if(s.type === 1){ ctx.arc(0,0,s.size/2,0,Math.PI*2); ctx.stroke(); }
                    else { ctx.moveTo(0,-s.size/2); ctx.lineTo(s.size/2,s.size/2); ctx.lineTo(-s.size/2,s.size/2); ctx.closePath(); ctx.stroke(); }
                    ctx.restore(); s.x += s.vx; s.y += s.vy; s.rotation += s.rotSpeed;
                });
                ctx.fillStyle = '#000000'; ctx.fillRect(canvas.width * 3.8, -canvas.height * 3, 800, canvas.height * 10);
                ctx.restore();

                if (elapsed < OUTRO_START + LOGO_OUTRO) {
                    let op = 0, sc = 1.0;
                    if (elapsed < INTRO_DUR) { let t = easeOutCubic(elapsed/INTRO_DUR); op = t; sc = 0.5 + 0.45 * t; }
                    else if (elapsed < OUTRO_START) { op = 1; sc = 0.95 + (0.07 * ((elapsed - INTRO_DUR)/STAY_DUR)); }
                    else { let t = (elapsed - OUTRO_START)/LOGO_OUTRO; op = Math.max(0, 1-t); sc = 1.02 - (0.05*t); }
                    ctx.save(); ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(sc, sc); ctx.globalAlpha = op;
                    ctx.filter = 'brightness(0)'; if (logo.complete) ctx.drawImage(logo, -160, -160, 320, 320);
                    ctx.restore();
                }
            }

            if (audioPlayer.currentTime > audioPlayer.duration - 1.5) {
                const fade = (audioPlayer.currentTime - (audioPlayer.duration - 1.5)) / 1.5;
                ctx.fillStyle = `rgba(0, 0, 0, ${Math.min(1, fade)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            requestAnimationFrame(render);
        }
        render();

        bgUpload.onchange = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (event) => bgImg.src = event.target.result; reader.readAsDataURL(file); } };
        fontUpload.onchange = async (e) => { const file = e.target.files[0]; if (file) { const fontFace = new FontFace('UserCustomFont', await file.arrayBuffer()); await fontFace.load(); document.fonts.add(fontFace); customFontName = 'UserCustomFont'; } };
        audioUpload.onchange = (e) => { const file = e.target.files[0]; if (file) audioPlayer.src = URL.createObjectURL(file); };

        document.getElementById('confirmBtn').onclick = async () => {
            const artist = document.getElementById('artist').value.trim(), title = document.getElementById('title').value.trim();
            if(!title) return alert("Title required");
            statusMsg.innerText = "Searching...";
            try {
                const res = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(title)}`);
                const data = await res.json();
                lyricsResults.innerHTML = "";
                data.filter(d => d.syncedLyrics).forEach((item, idx) => {
                    const card = document.createElement('div'); card.className = 'lyric-card'; card.id = `res-${item.id}`;
                    card.innerHTML = `<strong>${item.trackName}</strong><br><small>${item.artistName}</small>`;
                    card.onclick = () => parseLRC(item.syncedLyrics, item.id);
                    lyricsResults.appendChild(card); if (idx === 0) parseLRC(item.syncedLyrics, item.id);
                });
            } catch (e) { statusMsg.innerText = "Search failed."; }
        };

        audioPlayer.ontimeupdate = () => {
            const now = audioPlayer.currentTime + parseFloat(offsetSlider.value);
            let foundIndex = -1;
            for (let i = 0; i < syncedLyrics.length; i++) { if (syncedLyrics[i].time <= now) foundIndex = i; else break; }
            if (foundIndex !== -1 && foundIndex !== currentLineIndex) { currentLineIndex = foundIndex; targetText = syncedLyrics[foundIndex].text; isFading = true; }
        };

        let mediaRecorder, recordedChunks = [];
        recordBtn.onclick = async () => {
            if (mediaRecorder?.state === "recording") { mediaRecorder.stop(); audioPlayer.pause(); } 
            else {
                recordedChunks = []; resetPreviewState(); audioPlayer.currentTime = 0;
                const canvasStream = canvas.captureStream(60); 
                const audioContext = new AudioContext();
                const destination = audioContext.createMediaStreamDestination();
                audioContext.createMediaElementSource(audioPlayer).connect(destination);
                audioContext.createMediaElementSource(audioPlayer).connect(audioContext.destination);
                mediaRecorder = new MediaRecorder(new MediaStream([...canvasStream.getVideoTracks(), ...destination.stream.getAudioTracks()]), { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12000000 });
                mediaRecorder.ondataavailable = (e) => recordedChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(recordedChunks, { type: 'video/mp4' }));
                    a.download = `${document.getElementById('title').value || 'loft'}.mp4`; a.click();
                };
                mediaRecorder.start(); audioPlayer.play(); recordBtn.classList.add('recording');
            }
        };
    </script>
</body>
</html>
