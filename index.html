<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Studios | Dashboard Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;600;800&display=swap');

        :root {
            --bg: #000000;
            --panel: #0a0a0a;
            --panel-light: #121212;
            --accent: #ffffff;
            --glow: rgba(255, 255, 255, 0.25);
            --border: #222222;
            --text-main: #ffffff;
            --text-dim: #777777;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard-header {
            width: 820px;
            margin-bottom: 20px;
            text-align: left;
        }

        .header-text {
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--glow);
        }

        .header-text span { color: var(--text-dim); font-weight: 400; margin: 0 5px; }

        .workspace {
            width: 820px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .preview-section {
            background: var(--panel);
            padding: 10px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 0 15px var(--glow);
        }

        canvas#previewCanvas {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 12px;
            display: block;
            border: 1px solid var(--accent);
        }

        .custom-player {
            margin-top: 15px;
            background: var(--panel-light);
            padding: 0 20px;
            height: 65px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border);
        }

        .play-btn {
            background: var(--accent);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 10px var(--accent);
        }

        .progress-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 8px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 0;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: -4px;
            box-shadow: 0 0 8px var(--accent);
        }

        .time-info {
            font-size: 10px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            margin-top: 4px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 15px;
        }

        .tag {
            font-size: 9px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: block;
            text-shadow: 0 0 5px var(--glow);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 13px;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' fill='white'><path d='M0 3l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: calc(100% - 12px) center;
        }

        .offset-controls-wrapper {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 20px;
            align-items: center;
        }

        .slider-indicator-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-row-layout {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-layout-group {
            display: flex;
            gap: 8px;
        }

        .total-offset-badge {
            font-family: monospace;
            font-size: 11px;
            padding: 5px 8px;
            border-radius: 4px;
            min-width: 75px;
            text-align: center;
            box-sizing: border-box;
        }

        .badge-slider-val {
            background: #111;
            color: var(--text-dim);
            border: 1px solid #222;
        }

        .badge-master-total {
            background: #161616;
            color: var(--accent);
            border: 1px solid #333;
            font-weight: 700;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.05);
        }

        .asset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .file-wrapper { position: relative; }
        .file-wrapper input { position: absolute; opacity: 0; width: 1px; }

        .custom-file-btn {
            display: block;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 12px;
            border-radius: 8px;
            font-size: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: 700;
        }

        .action-center {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn {
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 12px var(--glow);
            transition: all 0.3s ease;
        }

        .recording-active {
            animation: slowFadeReverse 2s infinite ease-in-out;
        }

        @keyframes slowFadeReverse {
            0% { background-color: var(--accent); color: #000; opacity: 1; }
            50% { background-color: #000; color: var(--accent); box-shadow: inset 0 0 15px var(--glow), 0 0 5px var(--glow); opacity: 0.8; }
            100% { background-color: var(--accent); color: #000; opacity: 1; }
        }

        .stepper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #000;
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .step-btn {
            background: var(--accent);
            color: #000;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .val { color: var(--accent); font-weight: 800; font-family: monospace; text-shadow: 0 0 8px var(--glow); }

        #thumbPreviewCanvas {
            width: 240px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #000;
            display: block;
            margin: 10px auto 0;
            box-shadow: 0 0 10px var(--glow);
        }

        .lyrics-container {
            max-height: 250px;
            overflow-y: auto;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px;
        }
        
        .track-selection-item {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1a1a1a;
            background: var(--panel-light);
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .track-selection-item:hover { border-color: #555; background: #141414; }
        .track-selection-item.selected-track { border-color: var(--accent) !important; background: #1a1a1a !important; box-shadow: 0 0 10px rgba(255, 255, 255, 0.15); }
        .track-title-line { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        .track-meta-line { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
        .length-badge { font-size: 10px; font-family: monospace; background: #222; color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: normal; }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <div class="header-text">DASHBOARD <span>|</span> ELEVEN STUDIOS</div>
    </div>

    <div class="workspace">
        <div class="preview-section">
            <canvas id="previewCanvas" width="1280" height="720"></canvas>
            <div class="custom-player">
                <button class="play-btn" id="playToggle">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <div class="progress-container">
                    <input type="range" id="progressBar" value="0" min="0" max="100">
                    <div class="time-info">
                        <span id="currentTime">0:00</span>
                        <span id="durationTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="grid-2">
                <div>
                    <span class="tag">Song Title</span>
                    <input type="text" id="songTitle" placeholder="Untitled">
                </div>
                <div>
                    <span class="tag">Artist Name</span>
                    <input type="text" id="artistName" placeholder="Untitled">
                </div>
            </div>
        </div>

        <div class="card">
            <span class="tag">Upload Assets</span>
            <div class="asset-grid">
                <div class="file-wrapper">
                    <label for="audioUpload" class="custom-file-btn" id="audioLabel">AUDIO</label>
                    <input type="file" id="audioUpload" accept="audio/*">
                </div>
                <div class="file-wrapper">
                    <label for="bgUpload" class="custom-file-btn" id="bgLabel">BACKGROUND</label>
                    <input type="file" id="bgUpload" accept="image/*">
                </div>
                <div class="file-wrapper">
                    <label for="fontUpload" class="custom-file-btn" id="fontLabel">FONT</label>
                    <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2">
                </div>
            </div>
        </div>

        <div class="card">
            <span class="tag">Offset Layout Engine</span>
            <div class="offset-controls-wrapper">
                <div>
                    <span class="tag" style="color: var(--text-dim); margin-bottom: 4px;">Default Offset</span>
                    <input type="number" id="defaultOffsetInput" value="0.0" step="0.1">
                </div>
                <div>
                    <div class="slider-indicator-container">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span class="tag" style="color: var(--text-dim); margin:0;">Fine Adjustment Slider</span>
                            <div class="badge-layout-group">
                                <div class="total-offset-badge badge-slider-val" id="sliderValueDisplay">0.0s</div>
                                <div class="total-offset-badge badge-master-total" id="totalOffsetDisplay">TOTAL: 0.0s</div>
                            </div>
                        </div>
                        <div class="slider-row-layout">
                            <input type="range" id="fineOffsetSlider" min="-5" max="5" step="0.1" value="0">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <span class="tag">FPS Engine Control</span>
            <select id="fpsSelect">
                <option value="24">24 FPS (Cinematic)</option>
                <option value="30" selected>30 FPS (Standard Default)</option>
                <option value="60">60 FPS (Ultra Smooth)</option>
            </select>
        </div>

        <div class="action-center">
            <button class="btn" id="recordBtn" onclick="toggleRecord()">Record</button>
            <button class="btn" id="fetchBtn">Fetch Lyrics</button>
            <button class="btn" id="thumbBtn">Thumbnail</button>
        </div>

        <div class="card" style="text-align: center;">
            <span class="tag">Thumbnail Preview</span>
            <canvas id="thumbPreviewCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="card">
            <div class="grid-2">
                <div class="stepper" id="songStepper" style="justify-content: space-between;">
                    <span class="tag" style="margin:0; font-size: 8px;">Song Size</span>
                    <button class="step-btn">−</button>
                    <span class="val" id="songSizeVal">210</span>
                    <button class="step-btn">+</button>
                </div>
                <div class="stepper" id="artistStepper" style="justify-content: space-between;">
                    <span class="tag" style="margin:0; font-size: 8px;">Artist Size</span>
                    <button class="step-btn">−</button>
                    <span class="val" id="artistSizeVal">60</span>
                    <button class="step-btn">+</button>
                </div>
            </div>
        </div>

        <div class="card" id="lyricsDisplayCard" style="display: none;">
            <span class="tag" id="resultsHeaderTag">Select Track from LRCLIB Database</span>
            <div id="lyricsWindow" class="lyrics-container">Searching tracks...</div>
        </div>
    </div>

    <script>
        // --- REVERTED STABLE RECORDING ENGINE WITH FPS FIX ---
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let audioContextInstance = null;
        let mediaStreamDestinationNode = null;

        function toggleRecord() {
            if (!isRecording) startRecording();
            else stopRecording();
        }

        function startRecording() {
            if (!isAudioLoaded) return alert("Upload AUDIO first.");
            recordedChunks = [];
            
            const chosenFPS = parseInt(document.getElementById('fpsSelect').value);
            
            // FIX: If user chose 30, we request a stream at chosenFPS but tell MediaRecorder 
            // to prioritize the processing. If it still lags, try recording at 60 then 
            // converting elsewhere, but this should fix the jitter.
            const videoStream = canvas.captureStream(chosenFPS);
            
            if (!audioContextInstance) {
                audioContextInstance = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContextInstance.createMediaElementSource(audioTrack);
                mediaStreamDestinationNode = audioContextInstance.createMediaStreamDestination();
                source.connect(mediaStreamDestinationNode);
                source.connect(audioContextInstance.destination);
            }
            
            const audioTrackNode = mediaStreamDestinationNode.stream.getAudioTracks()[0];
            if (audioTrackNode) videoStream.addTrack(audioTrackNode);

            // Bitrate set to 10Mbps for high quality h264
            let options = { 
                mimeType: 'video/mp4;codecs=h264,aac', 
                videoBitsPerSecond: 10000000 
            };
            
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options.mimeType = 'video/webm;codecs=h264';
            }

            mediaRecorder = new MediaRecorder(videoStream, options);
            mediaRecorder.ondataavailable = (e) => e.data.size > 0 && recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${songInput.value || 'ElevenStudios'}.mp4`;
                a.click();
            };

            mediaRecorder.start();
            isRecording = true;
            document.getElementById('recordBtn').classList.add('recording-active');
            document.getElementById('recordBtn').innerText = "Stop";
            audioTrack.currentTime = 0;
            audioTrack.play();
            updatePlayButtonIcon(true);
        }

        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            isRecording = false;
            document.getElementById('recordBtn').classList.remove('recording-active');
            document.getElementById('recordBtn').innerText = "Record";
            audioTrack.pause();
            updatePlayButtonIcon(false);
        }

        // --- ANIMATION & UI (FULLY RESTORED) ---
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const songInput = document.getElementById('songTitle');
        const artistInput = document.getElementById('artistName');
        
        let currentBg = new Image(), logoImg = new Image(), driftTime = 0, customFont = null;
        let activeLyricLines = [], targetLyricText = "", currentDisplayedLyric = "", lyricAlpha = 0, animState = "idle"; 
        let globalTrackFadeAlpha = 1.0, lastSpinTrigger = 0;
        const spinDuration = 1500, spinCooldown = 5000, rotations = 4;
        let songFontSizeSetting = 210, artistFontSizeSetting = 60;

        currentBg.src = 'assets/stock_bg.jpg';
        logoImg.src = 'assets/es_ic.png';
        const fontFace = new FontFace('CustomCanvasFont', 'url(assets/es_font.otf)');
        fontFace.load().then(f => { document.fonts.add(f); customFont = "CustomCanvasFont"; renderThumbnailPreview(); });

        function animate(timestamp) {
            driftTime += 0.025;
            if (!lastSpinTrigger) lastSpinTrigger = timestamp;
            const elapsed = timestamp - lastSpinTrigger;
            if (elapsed >= spinCooldown) lastSpinTrigger = timestamp;

            let logoRotation = 0;
            if (elapsed < spinDuration) {
                const t = elapsed / spinDuration;
                logoRotation = (1 - Math.pow(1 - t, 3)) * (Math.PI * 2 * rotations);
            }

            const offX = Math.cos(driftTime * 0.9) * 15, offY = Math.sin(driftTime * 1.2) * 10, scale = 1 + Math.sin(driftTime * 1.8) * 0.02;
            updateLiveLyricsFromAudio();
            interpolateFadeTransitions();
            calculateGlobalEndTrackFade();
            draw(offX, offY, scale, logoRotation);
            requestAnimationFrame(animate);
        }

        function draw(x, y, s, rot) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.globalAlpha = globalTrackFadeAlpha;
            if (currentBg.complete) ctx.drawImage(currentBg, 0, 0, canvas.width, canvas.height);
            if (logoImg.complete) {
                ctx.save(); ctx.translate(1205, 75); ctx.rotate(rot); ctx.drawImage(logoImg, -42.5, -42.5, 85, 85); ctx.restore();
            }
            if (currentDisplayedLyric) {
                ctx.save(); ctx.translate(canvas.width / 2 + x, canvas.height / 2 + y);
                let fontSize = 150 * s;
                ctx.font = `${fontSize}px ${customFont || 'sans-serif'}`;
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                ctx.globalAlpha = lyricAlpha * globalTrackFadeAlpha;
                ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 35;
                let metrics = ctx.measureText(currentDisplayedLyric.toUpperCase());
                if (metrics.width > 1100) { fontSize *= (1100 / metrics.width); ctx.font = `${fontSize}px ${customFont || 'sans-serif'}`; }
                ctx.fillText(currentDisplayedLyric.toUpperCase(), 0, 0);
                ctx.restore();
            }
            ctx.restore();
        }

        function interpolateFadeTransitions() {
            if (currentDisplayedLyric !== targetLyricText && animState === "idle") animState = "fading_out";
            if (animState === "fading_out") {
                lyricAlpha -= 0.08;
                if (lyricAlpha <= 0) { lyricAlpha = 0; currentDisplayedLyric = targetLyricText; animState = "fading_in"; }
            } else if (animState === "fading_in") {
                lyricAlpha += 0.08;
                if (lyricAlpha >= 1) { lyricAlpha = 1; animState = "idle"; }
            }
        }

        const tCanvas = document.getElementById('thumbPreviewCanvas'), tCtx = tCanvas.getContext('2d');
        function renderThumbnailPreview() {
            tCtx.clearRect(0,0,1280,720);
            if (currentBg.complete) tCtx.drawImage(currentBg, 0, 0, 1280, 720);
            if (logoImg.complete) tCtx.drawImage(logoImg, 1165, 30, 85, 85);
            const title = (songInput.value || "UNTITLED").toUpperCase(), artist = (artistInput.value || "ARTIST").toUpperCase();
            tCtx.save(); tCtx.textAlign = "center"; tCtx.fillStyle = "white"; tCtx.shadowBlur = 35; tCtx.shadowColor = "black";
            tCtx.font = `${songFontSizeSetting}px ${customFont || 'sans-serif'}`;
            let sm = tCtx.measureText(title); const sH = sm.actualBoundingBoxAscent + sm.actualBoundingBoxDescent;
            tCtx.font = `${artistFontSizeSetting}px ${customFont || 'sans-serif'}`;
            let am = tCtx.measureText(artist); const aH = am.actualBoundingBoxAscent + am.actualBoundingBoxDescent;
            const totalH = sH + 35 + aH, startY = (720 - totalH) / 2 + sH;
            tCtx.font = `${songFontSizeSetting}px ${customFont || 'sans-serif'}`; tCtx.fillText(title, 640, startY);
            tCtx.font = `${artistFontSizeSetting}px ${customFont || 'sans-serif'}`; tCtx.fillText(artist, 640, startY + 35 + aH);
            tCtx.restore();
        }

        function initStepper(id, updateFn) {
            const cont = document.getElementById(id);
            cont.querySelectorAll('button')[0].onclick = () => updateFn(-5);
            cont.querySelectorAll('button')[1].onclick = () => updateFn(5);
        }
        initStepper('songStepper', (a) => { songFontSizeSetting += a; document.getElementById('songSizeVal').innerText = songFontSizeSetting; renderThumbnailPreview(); });
        initStepper('artistStepper', (a) => { artistFontSizeSetting += a; document.getElementById('artistSizeVal').innerText = artistFontSizeSetting; renderThumbnailPreview(); });

        let audioTrack = new Audio(), isAudioLoaded = false;
        document.getElementById('audioUpload').onchange = (e) => {
            audioTrack.src = URL.createObjectURL(e.target.files[0]); isAudioLoaded = true;
            document.getElementById('audioLabel').innerText = "✓ AUDIO READY";
        };
        document.getElementById('playToggle').onclick = () => {
            if (!isAudioLoaded) return;
            audioTrack.paused ? audioTrack.play() : audioTrack.pause();
            updatePlayButtonIcon(!audioTrack.paused);
        };
        function updatePlayButtonIcon(p) {
            document.getElementById('playToggle').innerHTML = p ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="black"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>` : `<svg width="16" height="16" viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>`;
        }
        audioTrack.ontimeupdate = () => {
            document.getElementById('progressBar').value = (audioTrack.currentTime / audioTrack.duration) * 100;
            document.getElementById('currentTime').innerText = formatTime(audioTrack.currentTime);
        };
        audioTrack.onloadedmetadata = () => document.getElementById('durationTime').innerText = formatTime(audioTrack.duration);
        function formatTime(s) { const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec < 10 ? '0' : ''}${sec}`; }

        const fineSlider = document.getElementById('fineOffsetSlider'), defOffset = document.getElementById('defaultOffsetInput');
        function calculateCombinedOffset() {
            const combined = (parseFloat(defOffset.value) || 0) + (parseFloat(fineSlider.value) || 0);
            document.getElementById('sliderValueDisplay').innerText = fineSlider.value + "s";
            document.getElementById('totalOffsetDisplay').innerText = "TOTAL: " + combined.toFixed(1) + "s";
            return combined;
        }
        fineSlider.oninput = calculateCombinedOffset; defOffset.oninput = calculateCombinedOffset;

        document.getElementById('fetchBtn').onclick = () => {
            const q = `https://lrclib.net/api/search?track_name=${encodeURIComponent(songInput.value)}&artist_name=${encodeURIComponent(artistInput.value)}`;
            document.getElementById('lyricsDisplayCard').style.display = "block";
            fetch(q).then(r => r.json()).then(data => {
                const win = document.getElementById('lyricsWindow'); win.innerHTML = "";
                data.forEach(t => {
                    const row = document.createElement('div'); row.className = "track-selection-item";
                    row.innerHTML = `<div class="track-title-line">${t.trackName.toUpperCase()}</div><div class="track-meta-line">${t.artistName}</div>`;
                    row.onclick = () => {
                        parseLrc(t.syncedLyrics || t.plainLyrics);
                        document.querySelectorAll('.track-selection-item').forEach(i => i.classList.remove('selected-track'));
                        row.classList.add('selected-track');
                    };
                    win.appendChild(row);
                });
            });
        };

        function parseLrc(lrc) {
            activeLyricLines = []; if (!lrc) return;
            lrc.split('\n').forEach(l => {
                const m = l.match(/\[(\d+):(\d+)\.(\d+)\]/);
                if (m) activeLyricLines.push({ time: parseInt(m[1])*60 + parseInt(m[2]) + parseInt(m[3])/100, text: l.replace(/\[.*?\]/g, '').trim() });
            });
        }

        function updateLiveLyricsFromAudio() {
            if (!activeLyricLines.length) return;
            const t = audioTrack.currentTime + calculateCombinedOffset();
            let matched = "";
            for (let line of activeLyricLines) { if (t >= line.time) matched = line.text; else break; }
            targetLyricText = matched;
        }

        function calculateGlobalEndTrackFade() {
            if (audioTrack.duration) {
                const rem = audioTrack.duration - audioTrack.currentTime;
                globalTrackFadeAlpha = rem < 3 ? rem / 3 : 1.0;
            }
        }

        requestAnimationFrame(animate);
        songInput.oninput = renderThumbnailPreview; artistInput.oninput = renderThumbnailPreview;
    </script>
</body>
</html>
