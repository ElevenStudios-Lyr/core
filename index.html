<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleven Studios | Smooth Sync</title>
    <style>
        @font-face { 
            font-family: 'LyricFont'; 
            src: url('defaultfont.otf') format('opentype'); 
            font-display: block; 
        }
        :root { --accent: #ff85a2; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; padding-bottom: 100px; }
        #preview-container { width: 800px; box-shadow: 0 25px 70px rgba(0,0,0,0.9); margin-bottom: 20px; border-radius: 15px; overflow: hidden; border: 2px solid #222; background: #111; }
        canvas { display: block; width: 100%; height: auto; background: #000; }
        #player-bar { width: 100%; background: #111; padding: 5px; border-top: 1px solid #333; box-sizing: border-box; }
        audio { width: 100%; height: 40px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
        .dashboard { background: #111; padding: 25px; border-radius: 20px; width: 800px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; border: 1px solid #333; }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .label { font-size: 11px; color: #777; min-width: 90px; text-transform: uppercase; letter-spacing: 1px; }
        input[type="text"], input[type="file"], input[type="number"] { background: #1a1a1a; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; flex: 1; font-size: 14px; font-family: inherit; }
        .checkbox-container { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #ccc; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
        button { padding: 15px; border: none; color: #000; font-weight: bold; text-transform: uppercase; cursor: pointer; border-radius: 10px; flex: 1; transition: 0.3s; font-family: inherit; }
        #confirmBtn { background: var(--accent); }
        #recordBtn { background: #e74c3c; color: white; }
        #recordBtn.recording { background: #fff; color: #e74c3c; animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
        #lyrics-results { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-height: 150px; overflow-y: auto; padding: 5px; background: #0a0a0a; border-radius: 12px; }
        .lyric-card { background: #161616; padding: 10px; border-radius: 8px; border: 1px solid #222; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
        .lyric-card.active { border-color: var(--accent); background: #1f1417; }
        .status { font-size: 12px; color: #555; text-align: center; margin-top: 5px; }
        .thumb-preview-section { width: 800px; text-align: center; border-top: 2px dashed #333; padding-top: 20px; margin-top: 20px; }
        #thumbPreviewCanvas { width: 400px; border-radius: 10px; border: 1px solid #444; }
    </style>
</head>
<body>

    <div id="preview-container">
        <canvas id="previewCanvas" width="1280" height="720"></canvas>
        <div id="player-bar"><audio id="audioPlayer" controls crossorigin="anonymous"></audio></div>
    </div>

    <div class="dashboard">
        <div class="input-row">
            <span class="label">Custom Font</span>
            <input type="file" id="fontUpload" accept=".ttf,.otf">
            <label class="checkbox-container"><input type="checkbox" id="blurToggle"> Blur BG</label>
            <label class="checkbox-container"><input type="checkbox" id="simpleLogo" checked> Simple Logo</label>
            <label class="checkbox-container"><input type="checkbox" id="hideShapes" checked> Hide Shapes</label>
        </div>
        <div class="input-row">
            <span class="label">Bitrate (Mbps)</span>
            <input type="number" id="bitrateInput" value="8" min="1" max="15">
            <span style="font-size: 11px; color: #555;">Lower is faster for 2GB RAM</span>
        </div>
        <div class="input-row"><span class="label">Background</span><input type="file" id="bgUpload" accept="image/*"></div>
        <div class="input-row"><span class="label">Audio File</span><input type="file" id="audioUpload" accept="audio/*"></div>
        <div class="input-row"><span class="label">Title</span><input type="text" id="title" placeholder="Song Title"></div>
        <div class="input-row"><span class="label">Artist</span><input type="text" id="artist" placeholder="Artist Name"></div>
        <div class="input-row"><span class="label">Offset</span><input type="range" id="lyricOffset" min="-2.0" max="2.0" step="0.1" value="0"><span id="offsetVal">0.0s</span></div>
        
        <div class="input-row">
            <button id="confirmBtn">Sync & Search</button>
            <button id="recordBtn">Start Smooth Export</button>
        </div>
        <div id="lyrics-results"></div>
        <div class="status" id="statusMsg">Eleven Studios | Ready</div>
    </div>

    <div class="thumb-preview-section">
        <canvas id="thumbPreviewCanvas" width="1280" height="720" style="display:none;"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const audioPlayer = document.getElementById('audioPlayer'), recordBtn = document.getElementById('recordBtn'), statusMsg = document.getElementById('statusMsg'), blurToggle = document.getElementById('blurToggle'), simpleLogo = document.getElementById('simpleLogo'), hideShapes = document.getElementById('hideShapes'), bitrateInput = document.getElementById('bitrateInput'), bgUpload = document.getElementById('bgUpload'), fontUpload = document.getElementById('fontUpload'), lyricsResults = document.getElementById('lyrics-results'), offsetSlider = document.getElementById('lyricOffset'), offsetDisplay = document.getElementById('offsetVal');
        
        const logo = new Image(); logo.src = 'ic.png';
        let bgImg = new Image(); bgImg.src = 'https://vip-go.premiumbeat.com/wp-content/uploads/2018/10/pink-sky-cover.jpg';
        bgImg.crossOrigin = "anonymous";

        let syncedLyrics = [], currentLineIndex = -1, customFontName = 'LyricFont', isExporting = false;
        const INTRO_DUR = 800, STAY_DUR = 1800, OUTRO_START = 2600, WIPE_START = 2000, WIPE_DUR = 1400;

        const memphisShapes = Array.from({length: 80}, () => ({
            x: Math.random() * 5000, y: Math.random() * 2000 - 500, size: Math.random() * 20 + 15, 
            type: Math.floor(Math.random() * 3), rotation: Math.random() * Math.PI * 2
        }));

        function easeInOutSine(x) { return -(Math.cos(Math.PI * x) - 1) / 2; }

        function renderFrame(time) {
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const elapsed = time * 1000;
            const adjTime = time + parseFloat(offsetSlider.value);
            let wipeProgress = (elapsed > WIPE_START) ? easeInOutSine(Math.min(1, (elapsed - WIPE_START) / WIPE_DUR)) : 0;

            // Background & Lyrics
            if (wipeProgress > 0) {
                ctx.save();
                if (blurToggle.checked) ctx.filter = 'blur(8px)';
                ctx.drawImage(bgImg, 0, 0, 1280, 720);
                ctx.restore();
                
                ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "white";
                ctx.shadowColor = "black"; ctx.shadowBlur = 20;

                let nowIdx = -1;
                for (let i = 0; i < syncedLyrics.length; i++) { if (syncedLyrics[i].time <= adjTime) nowIdx = i; else break; }
                if (nowIdx !== -1) {
                    ctx.font = `bold 100px "${customFontName}"`;
                    ctx.fillText(syncedLyrics[nowIdx].text.toUpperCase(), 640, 360);
                }
            }

            // Wipe Effect
            if (wipeProgress < 1) {
                ctx.save();
                ctx.translate(-canvas.width * 4 * wipeProgress, 0);
                ctx.rotate(-15 * Math.PI / 180);
                ctx.fillStyle = "white";
                ctx.fillRect(-1000, -2000, 5000, 5000);
                ctx.restore();

                // Simple Logo during intro
                if (elapsed < OUTRO_START) {
                    let op = (elapsed < INTRO_DUR) ? elapsed/INTRO_DUR : (elapsed < WIPE_START ? 1 : 1 - (elapsed-WIPE_START)/600);
                    ctx.save(); ctx.globalAlpha = Math.max(0, op);
                    ctx.drawImage(logo, 640-150, 360-150, 300, 300);
                    ctx.restore();
                }
            }
        }

        function loop() {
            if (!isExporting) renderFrame(audioPlayer.currentTime);
            requestAnimationFrame(loop);
        }
        loop();

        recordBtn.onclick = async () => {
            isExporting = true;
            statusMsg.innerText = "Recording Smoothly...";
            const chunks = [];
            const stream = canvas.captureStream(30); // Capture at 30fps smooth
            
            const audioCtx = new AudioContext();
            const dest = audioCtx.createMediaStreamDestination();
            const source = audioCtx.createMediaElementSource(audioPlayer);
            source.connect(dest); source.connect(audioCtx.destination);

            const combined = new MediaStream([...stream.getVideoTracks(), ...dest.stream.getAudioTracks()]);
            const recorder = new MediaRecorder(combined, { 
                mimeType: 'video/mp4;codecs=avc1', 
                videoBitsPerSecond: parseInt(bitrateInput.value) * 1000000 
            });

            recorder.ondataavailable = (e) => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/mp4' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = "video.mp4"; a.click();
                isExporting = false; statusMsg.innerText = "Export Finished";
            };

            audioPlayer.currentTime = 0;
            recorder.start();
            audioPlayer.play();

            // Direct smooth rendering during record
            const recordLoop = () => {
                if (audioPlayer.paused || audioPlayer.ended) {
                    recorder.stop();
                    return;
                }
                renderFrame(audioPlayer.currentTime);
                requestAnimationFrame(recordLoop);
            };
            recordLoop();
        };

        // File handling
        bgUpload.onchange = (e) => { const reader = new FileReader(); reader.onload = (ev) => bgImg.src = ev.target.result; reader.readAsDataURL(e.target.files[0]); };
        fontUpload.onchange = async (e) => { const b = await e.target.files[0].arrayBuffer(); const f = new FontFace('LyricFont', b); await f.load(); document.fonts.add(f); customFontName = 'LyricFont'; };
        document.getElementById('audioUpload').onchange = (e) => audioPlayer.src = URL.createObjectURL(e.target.files[0]);
        offsetSlider.oninput = () => offsetDisplay.innerText = `${parseFloat(offsetSlider.value).toFixed(1)}s`;

        document.getElementById('confirmBtn').onclick = async () => {
            const a = document.getElementById('artist').value, t = document.getElementById('title').value;
            statusMsg.innerText = "Searching...";
            const r = await fetch(`https://lrclib.net/api/search?artist_name=${encodeURIComponent(a)}&track_name=${encodeURIComponent(t)}`);
            const d = await r.json();
            if (d[0]) {
                syncedLyrics = d[0].syncedLyrics.split('\n').map(l => {
                    const m = l.match(/\[(\d+):(\d+\.\d+)\]/);
                    return m ? { time: parseFloat(m[1])*60 + parseFloat(m[2]), text: l.replace(/\[.*\]/, '').trim() } : null;
                }).filter(x => x);
                statusMsg.innerText = "Lyrics Synced!";
            }
        };
    </script>
</body>
</html>
